<section class="login-new">
  <div class="login-container">
    <!-- Sección izquierda: Formulario de inicio de sesión -->
    <div class="login-form-section">
      <!-- Identidad institucional -->
      <div class="login-brand">
        <img src="/assets/images/escudoB.png" alt="Escudo BUAP" class="logo-buap" />
        <span class="brand-title">Sistema Escolar</span>
      </div>

      <!-- Encabezado del formulario -->
      <h2 class="login-title">Iniciar sesión</h2>
      <p class="login-subtitle">Ingresa los datos que registraste</p>

      <!-- Formulario de inicio de sesión -->
      <form (ngSubmit)="login()" class="login-form" #form="ngForm">
        <!-- Campo: Correo electrónico -->
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            name="username"
            class="form-control"
            placeholder="nombre@correo.com"
            autocomplete="username"
            [(ngModel)]="username"
          />

          @if (errors.username) {
            <div class="invalid-feedback d-block">{{ errors.username }}</div>
          }
        </div>

        <!-- Campo: Contraseña -->
        <div class="form-group">
          <label for="password">Contraseña</label>

          <div class="password-container">
            <input
              [type]="typeInput"
              id="password"
              name="password_user"
              class="form-control pwd"
              placeholder="Mínimo 8 caracteres"
              autocomplete="current-password"
              [(ngModel)]="password"
            />

            <!-- Mostrar y ocultar contraseña -->
            <button
              type="button"
              class="show-password"
              (click)="showPassword()"
              [attr.aria-label]="
                typeInput === 'password' ? 'Mostrar contraseña' : 'Ocultar contraseña'
              "
              [attr.aria-pressed]="typeInput === 'text'"
            >
              <i
                class="bi"
                [class.bi-eye-fill]="typeInput === 'password'"
                [class.bi-eye-slash-fill]="typeInput === 'text'"
                aria-hidden="true"
              ></i>
            </button>
          </div>

          @if (errors.password) {
            <div class="invalid-feedback d-block">{{ errors.password }}</div>
          }
        </div>

        <!-- Recuperación de contraseña -->
        <div class="form-links">
          <button type="button" class="login-text-link" (click)="olvideContrasena()">
            ¿Olvidaste tu contraseña?
          </button>
        </div>

        <!-- Botón de inicio de sesión -->
        <button type="submit" class="btn-login" [disabled]="load">
          @if (load) {
            Iniciando sesión...
          } @else {
            Iniciar sesión
          }
        </button>

        <!-- Registro de usuario -->
        <div class="form-register">
          <span>¿No tienes cuenta?</span>
          <button type="button" class="login-text-link" (click)="registrar()">Regístrate</button>
        </div>
      </form>
    </div>

    <!-- Sección derecha: Imagen de bienvenida -->
    <div class="login-illustration-section">
      <div class="welcome-message">
        <h2>Bienvenido al Sistema Escolar</h2>
        <p>Gestiona tus actividades académicas de manera eficiente y sencilla.</p>
      </div>

      <img
        src="/assets/images/buap-fcc.jpg"
        alt="Instalaciones de la Facultad de Ciencias de la Computación BUAP"
        class="login-illustration"
      />
    </div>
  </div>
</section>
